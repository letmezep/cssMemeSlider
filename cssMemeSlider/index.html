<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>CSS Meme Slider</title>
</head>
<body>
    
    <div class="wrapper">
        <div class="container">

            <div class="slider_image">
                <img src="./IMG/img1.jpg" alt="image_1">
                <img src="./IMG/img2.jpg" alt="image_2">
                <img src="./IMG/img3.jpg" alt="image_3">
                <img src="./IMG/img4.jpg" alt="image_4">
            </div>

            <div class="slider_panel">
                
                    <form class="slider_buttons">
                        <div class="button_container">
                            <input class="radio_button" type="radio" name="slide" id="radio_1" value="1" checked>
                            <label for="radio_1"></label>
                        </div>
                                                
                        <div class="button_container">
                        <input class="radio_button" type="radio" name="slide" id="radio_2" value="2">
                        <label for="radio_2"></label>
</div>

                        <div class="button_container">
                        <input class="radio_button" type="radio" name="slide" id="radio_3" value="3">
                        <label for="radio_3"></label>
</div>
                  <div class="button_container">
                        <input class="radio_button" type="radio" name="slide" id="radio_4" value="4">
                        <label for="radio_4"></label>
                        </div>
                    </form>
                
                <div class="slider_txt">
                    Dat Boi!
                </div>
            </div>
        </div>
    </div>
</body>
</html>
