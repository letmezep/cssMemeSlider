<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>CSS Meme Slider</title>
</head>
<body>
    
    <div class="wrapper">
        <div class="container">

                <input type="radio" name="slider" id="slider_image1"checked>
                <input type="radio" name="slider" id="slider_image2">
                <input type="radio" name="slider" id="slider_image3">
                <input type="radio" name="slider" id="slider_image4">

                <div class="slider_images">
                    <div class="slide">
                        <img  src="./IMG/img1.jpg" alt="image_1" >
                    </div>
                    
                    <div class="slide">
                        <img src="./IMG/img2.jpg" alt="image_2">
                    </div>
                    
                    <div class="slide">
                        <img src="./IMG/img3.jpg" alt="image_3">
                    </div>

                    <div class="slide">
                        <img src="./IMG/img4.jpg" alt="image_4">    
                    </div>
                </div>
 
                <div class="slider_panel">                    
                    <label class="label_area" for="slider_image1"></label>
                    <label class="label_area" for="slider_image2"></label>
                    <label class="label_area" for="slider_image3"></label>
                    <label class="label_area" for="slider_image4"></label>
                </div>

                <div class="text_block">
                    <div class="slide_text text1">Here come dat boi!</div>
                    <div class="slide_text text2">Who checked my work?</div>
                    <div class="slide_text text3">Where are the input buttons?</div>
                    <div class="slide_text text4">Save me!</div>
                </div>
            
        </div>
    </div>
</body>
</html>
