<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>CSS Meme Slider</title>
</head>
<body>
    
    <div class="wrapper">
        <div class="container">

            <div class="slider_image">
                <img src="./IMG/img1.jpg" alt="first slide">
            </div>

            <div class="slider_panel">
                <div class="slider_controls">
                    <div class="slider_buttons">
                        <input type="radio" name="slide1" id="radio_slide1">
                        <input type="radio" name="slide2" id="radio_slide2">
                        <input type="radio" name="slide3" id="radio_slide3">
                        <input type="radio" name="slide4" id="radio_slide4">
                    </div>
                </div>
                <div class="slider_txt">
                    Dat boi!
                </div>
            </div>
        </div>
    </div>
</body>
</html>
